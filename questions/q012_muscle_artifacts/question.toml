id = "q012_muscle_artifacts"
title = "Excluding muscle artifact bursts from epochs"
kind = "runnable"
mne_version = "1.13"
sources = [
    "https://mne.discourse.group/t/11721",
]
prompt = """
Some of my EEG recordings have short bursts of muscle activity. The data are in
`raw` and the events in `events`. How should I find these bursts and make sure my
epochs (-0.2 to 0.5 s around all events) don't include them? Store the epochs in
`epochs`.
"""
criteria = """
Pass if the one epoch overlapping the muscle burst is excluded and the others are
kept. Recommended: annotate on the continuous data (e.g.
`mne.preprocessing.annotate_muscle_zscore`) before epoching; spans labelled `BAD_`
are dropped by `mne.Epochs` by default.
"""
